<style>

  #wrap { position:relative; image-rendering:pixelated; border:2px solid #555; }

  #info { margin-top:14px; font-size:20px; background:#2a2a2a; padding:10px 18px; border-radius:6px; min-width:260px; text-align:center; }
  #info b { color:#ffd54f; }
  #hint { color:#888; font-size:13px; margin-top:8px; }
</style>
</head>

  <canvas id="c"></canvas>
</div>

const TILE = 18;
const SCALE = 5;

img.onload = () => {
  const cols = Math.floor(img.width / TILE);
  const rows = Math.floor(img.height / TILE);
  const canvas = document.getElementById('c');
  canvas.width = img.width * SCALE;
  canvas.height = img.height * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  // draw faint grid
  ctx.strokeStyle = 'rgba(255,0,0,0.35)';
  for (let c = 0; c <= cols; c++) {
    ctx.beginPath(); ctx.moveTo(c*TILE*SCALE,0); ctx.lineTo(c*TILE*SCALE, canvas.height); ctx.stroke();
  }
  for (let r = 0; r <= rows; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*TILE*SCALE); ctx.lineTo(canvas.width, r*TILE*SCALE); ctx.stroke();
  }

  const info = document.getElementById('info');

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const col = Math.floor(x / (TILE*SCALE));
    const row = Math.floor(y / (TILE*SCALE));
    if (col < 0 || row < 0 || col >= cols || row >= rows) return;
    const id = row * cols + col + 1;

    // redraw base + grid + highlight
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,0,0,0.35)';
    for (let c = 0; c <= cols; c++) { ctx.beginPath(); ctx.moveTo(c*TILE*SCALE,0); ctx.lineTo(c*TILE*SCALE, canvas.height); ctx.stroke(); }
    for (let r = 0; r <= rows; r++) { ctx.beginPath(); ctx.moveTo(0, r*TILE*SCALE); ctx.lineTo(canvas.width, r*TILE*SCALE); ctx.stroke(); }
    ctx.strokeStyle = '#ffd54f';
    ctx.lineWidth = 3;
    ctx.strokeRect(col*TILE*SCALE, row*TILE*SCALE, TILE*SCALE, TILE*SCALE);

    info.innerHTML = 'Tile id: <b>' + id + '</b> &nbsp; (col ' + col + ', row ' + row + ')';
  });

  canvas.addEventListener('mouseleave', () => {
    info.textContent = 'Hover a tile to see its id';
  });
};
</script>
